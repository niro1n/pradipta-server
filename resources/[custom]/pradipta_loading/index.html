<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRADIPTA — Private Family Server</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <video id="bg-video" autoplay loop playsinline preload="auto">
        <source src="assets/video/pradipta-loading.mp4" type="video/mp4">
    </video>

    <div class="cinematic-overlay"></div>
    <div class="vignette-overlay"></div>

    <main class="loading-wrapper">
        <header class="top-header">
            <div class="badge-env">PRIVATE ENVIRONMENT</div>
        </header>

        <section class="center-content">
            <div class="logo-frame">
                <img src="assets/logo/pradipta-logo-animation.gif" alt="PRADIPTA Emblem" class="medallion-logo">
            </div>

            <div class="brand-text-block">
                <h1 class="brand-title">PRADIPTA</h1>
                <p class="brand-subtitle">PRIVATE FAMILY SERVER</p>
            </div>

            <div class="status-block">
                <div class="status-indicator">
                    <span class="status-dot"></span>
                    <span id="status-text" class="status-text">INITIALIZING</span>
                </div>

                <div class="progress-bar-container">
                    <div id="progress-bar-fill" class="progress-bar-fill"></div>
                </div>

                <div class="progress-info">
                    <span id="progress-detail" class="progress-detail">ESTABLISHING CONNECTION</span>
                    <span id="progress-percent" class="progress-percent">0%</span>
                </div>
            </div>
        </section>

        <footer class="bottom-bar">
            <div class="meta-tag">
                <span>SANDBOX</span>
                <span class="meta-separator">•</span>
                <span>LOCALHOST</span>
            </div>

            <div class="controls-tag">
                <button id="sound-toggle" class="sound-toggle-btn is-active" type="button" aria-label="Toggle Audio" title="Toggle Audio (Shortcut: M)">
                    <svg class="sound-icon sound-icon-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <line x1="23" y1="9" x2="17" y2="15"></line>
                        <line x1="17" y1="9" x2="23" y2="15"></line>
                    </svg>
                    <svg class="sound-icon sound-icon-active" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                    </svg>
                    <span id="sound-label" class="sound-label">AUDIO ACTIVE [M]</span>
                </button>
            </div>
        </footer>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
