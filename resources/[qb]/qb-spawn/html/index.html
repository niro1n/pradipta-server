<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRADIPTA — Pilih Lokasi</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" v-cloak>
        <div class="spawn-container" v-if="show">
            <div class="spawn-card">
                <div class="card-header">
                    <div class="header-brand">
                        <img src="assets/logo/pradipta-logo-512.png" alt="PRADIPTA" class="brand-logo">
                        <div class="brand-titles">
                            <div class="brand-name">PRADIPTA</div>
                            <div class="brand-badge">
                                <span class="badge-dot"></span>
                                <span>PRIVATE SANDBOX</span>
                            </div>
                        </div>
                    </div>
                    <div class="panel-subtitle">{{ translate('where_would_you_like_to_start') || 'Pilih Lokasi' }}</div>
                </div>

                <div class="locations-list">
                    <button
                        v-if="!newChar"
                        type="button"
                        class="location-item"
                        :class="{'is-selected': selectedValue.type === 'current' && selectedValue.name === 'current'}"
                        @click="click_location('current', 'current', translate('last_location') || 'Lokasi terakhir')"
                    >
                        <div class="location-icon">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                        </div>
                        <div class="location-info">
                            <div class="location-name">{{ translate('last_location') || 'Lokasi terakhir' }}</div>
                            <div class="location-sub">Posisi terakhir pemain</div>
                        </div>
                        <div class="location-badge" v-if="selectedValue.type === 'current' && selectedValue.name === 'current'">{{ translate('selected') || 'Dipilih' }}</div>
                    </button>

                    <button
                        v-for="(loc, locKey) in positions.normal"
                        :key="'normal-' + locKey"
                        type="button"
                        class="location-item"
                        :class="{'is-selected': selectedValue.type === 'normal' && selectedValue.name === locKey}"
                        @click="click_location('normal', locKey, loc.label)"
                    >
                        <div class="location-icon">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                        </div>
                        <div class="location-info">
                            <div class="location-name">{{ loc.label }}</div>
                            <div class="location-sub">Area publik</div>
                        </div>
                        <div class="location-badge" v-if="selectedValue.type === 'normal' && selectedValue.name === locKey">{{ translate('selected') || 'Dipilih' }}</div>
                    </button>

                    <button
                        v-for="(house, hIdx) in positions.house"
                        :key="'house-' + hIdx"
                        type="button"
                        class="location-item"
                        :class="{'is-selected': selectedValue.type === 'house' && selectedValue.name === house.house}"
                        @click="click_location('house', house.house, house.label)"
                    >
                        <div class="location-icon">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                        </div>
                        <div class="location-info">
                            <div class="location-name">{{ house.label }}</div>
                            <div class="location-sub">Properti pribadi</div>
                        </div>
                        <div class="location-badge" v-if="selectedValue.type === 'house' && selectedValue.name === house.house">{{ translate('selected') || 'Dipilih' }}</div>
                    </button>

                    <button
                        v-for="(apt, aptKey) in positions.appartment"
                        :key="'apt-' + aptKey"
                        type="button"
                        class="location-item"
                        :class="{'is-selected': selectedValue.type === 'appartment' && selectedValue.name === aptKey}"
                        @click="click_location('appartment', aptKey, apt.label)"
                    >
                        <div class="location-icon">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect><line x1="9" y1="22" x2="9" y2="22.01"></line><line x1="15" y1="22" x2="15" y2="22.01"></line><line x1="9" y1="6" x2="9" y2="6.01"></line><line x1="15" y1="6" x2="15" y2="6.01"></line><line x1="9" y1="10" x2="9" y2="10.01"></line><line x1="15" y1="10" x2="15" y2="10.01"></line><line x1="9" y1="14" x2="9" y2="14.01"></line><line x1="15" y1="14" x2="15" y2="14.01"></line><line x1="9" y1="18" x2="9" y2="18.01"></line><line x1="15" y1="18" x2="15" y2="18.01"></line></svg>
                        </div>
                        <div class="location-info">
                            <div class="location-name">{{ apt.label }}</div>
                            <div class="location-sub">Apartemen</div>
                        </div>
                        <div class="location-badge" v-if="selectedValue.type === 'appartment' && selectedValue.name === aptKey">{{ translate('selected') || 'Dipilih' }}</div>
                    </button>

                    <div class="empty-state" v-if="!hasLocations">
                        {{ translate('no_locations') || 'Tidak ada lokasi tersedia' }}
                    </div>
                </div>

                <div class="card-footer">
                    <div class="preview-box" v-if="selectedValue.name">
                        <span class="preview-label">LOKASI TERPILIH</span>
                        <span class="preview-name">{{ selectedDisplayName }}</span>
                    </div>

                    <button
                        type="button"
                        class="btn-confirm"
                        :disabled="!selectedValue.type || !selectedValue.name"
                        @click="submit_spawn"
                    >
                        <span>{{ translate('confirm') || 'Mulai di sini' }}</span>
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="vue.js"></script>
    <script src="app.js"></script>
</body>
</html>
